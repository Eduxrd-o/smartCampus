<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Usuarios</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      placeholder="Buscar por nombre"
      [debounce]="200"
      (ionInput)="buscarUsuario($event)"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="center-state" *ngIf="cargando">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando usuarios...</p>
  </div>

  <ion-card *ngIf="!cargando && errorMensaje" color="light">
    <ion-card-content class="error-box">
      <ion-text color="danger">{{ errorMensaje }}</ion-text>
      <ion-button fill="outline" size="small" (click)="cargarUsuarios()">
        <ion-icon slot="start" name="refresh-outline"></ion-icon>
        Reintentar
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="!cargando && !errorMensaje && usuariosVisibles.length === 0">
    <ion-card-content>
      No se encontraron usuarios que coincidan con "{{ terminoBusqueda }}".
    </ion-card-content>
  </ion-card>

  <ion-card *ngFor="let user of usuariosVisibles">
    <ion-card-header>
      <div class="user-header">
        <ion-icon name="person-circle-outline" color="primary"></ion-icon>
        <div>
          <ion-card-title>{{ user.name }}</ion-card-title>
          <ion-card-subtitle>&#64;{{ user.username }}</ion-card-subtitle>
        </div>
      </div>
    </ion-card-header>

    <ion-card-content>
      <p class="info-row">
        <ion-icon name="mail-outline"></ion-icon>
        <span>{{ user.email }}</span>
      </p>
      <p class="info-row">
        <ion-icon name="call-outline"></ion-icon>
        <span>{{ user.phone }}</span>
      </p>
    </ion-card-content>
  </ion-card>

  <ion-infinite-scroll
    [disabled]="cargando || !!errorMensaje || !hayMasUsuarios"
    (ionInfinite)="cargarMas($event)"
  >
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Cargando más usuarios..."
    ></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
